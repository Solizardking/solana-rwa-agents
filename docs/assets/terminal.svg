<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Dry-run terminal">
  <rect width="960" height="340" rx="20" fill="#0b0b12"/>
  <rect x="1" y="1" width="958" height="338" rx="19" fill="none" stroke="#2a2a3d"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <text x="110" y="31" fill="#6f6f86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npm run agents:dry-run</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#1d1d2c"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#d7d7ea">
    <text x="28" y="84" fill="#14F195">$</text>
    <text x="48" y="84">npm run agents:dry-run</text>

    <text x="28" y="128" fill="#9945FF">▸</text>
    <text x="52" y="128">ERC-8004 type: https://eips.ethereum.org/EIPS/eip-8004#registration-v1
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.2;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="160" fill="#9945FF">▸</text>
    <text x="52" y="160">Paired RWA asset id: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.36;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="192" fill="#9945FF">▸</text>
    <text x="52" y="192">Genesis launchType: bondingCurve
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.52;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="224" fill="#9945FF">▸</text>
    <text x="52" y="224">Genesis setToken: true
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.66;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="256" fill="#9945FF">▸</text>
    <text x="52" y="256">Trade plan: mint + transfer from Asset Signer PDA
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.8;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="28" y="300" fill="#14F195">ok
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <rect x="58" y="288" width="9" height="16" fill="#14F195">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
